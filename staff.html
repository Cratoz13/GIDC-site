<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GIDC — Espace Staff</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
    <img src="../images/logo-gidc.png" alt="Logo GIDC">
</div>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="communaute.html">Le GIDC</a>
            <a href="jeux.html">Nos jeux</a>
            <a href="operations.html">Opérations</a>
            <a href="evenements.html">Événements</a>
            <a href="candidature.html">Candidature</a>
            <a href="reglement.html">Règlement</a>
        </nav>

    </header>


    <main>

        <section class="events-header">

            <p class="section-small">
                ESPACE PRIVÉ
            </p>

            <h1>
                STAFF GIDC
            </h1>

            <p>
                Connexion réservée au staff.
            </p>

        </section>


        <section class="events-section">

            <div class="events-intro">

                <h2>
                    CONNEXION
                </h2>

                <form id="staff-login-form">

                    <div class="form-group">

                        <label for="email">
                            EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            MOT DE PASSE
                        </label>

                        <input
                            type="password"
                            id="password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="button"
                    >
                        SE CONNECTER
                    </button>

                    <p id="login-message"></p>

                </form>

            </div>

        </section>


        <section
            id="candidatures"
            class="events-section"
            style="display: none;"
        >

            <div class="events-intro">

                <h2>
                    CANDIDATURES REÇUES
                </h2>

                <div id="candidatures-list"></div>

            </div>

        </section>

    </main>


    <script type="module">

        const SUPABASE_URL =
            "https://uvyicxdvjoqntjtcrzzg.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_4T9TDzY8A_1WRKAojXdXSA_0aoFvXWl";


        const form =
            document.getElementById("staff-login-form");

        const message =
            document.getElementById("login-message");

        const candidaturesSection =
            document.getElementById("candidatures");

        const candidaturesList =
            document.getElementById("candidatures-list");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            message.textContent =
                "Connexion en cours...";


            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            try {

                const response = await fetch(
                    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_ANON_KEY
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error_description ||
                        "Connexion refusée"
                    );

                }


                localStorage.setItem(
                    "gidc_access_token",
                    data.access_token
                );


                message.textContent =
                    "Connexion réussie.";


                await afficherCandidatures(
                    data.access_token
                );


            } catch (error) {

                console.error(error);

                message.textContent =
                    "❌ Email ou mot de passe incorrect.";

            }

        });


        async function afficherCandidatures(accessToken) {

            try {

                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/candidatures?select=*&order=created_at.desc`,
                    {
                        method: "GET",

                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );


                if (!response.ok) {

                    const erreur =
                        await response.text();

                    console.error(erreur);

                    throw new Error(
                        "Impossible de récupérer les candidatures."
                    );

                }


                const candidatures =
                    await response.json();


                candidaturesSection.style.display =
                    "block";


                if (candidatures.length === 0) {

                    candidaturesList.innerHTML = `
                        <div class="event-card">

                            <h3>
                                AUCUNE CANDIDATURE
                            </h3>

                            <p>
                                Aucune candidature reçue pour le moment.
                            </p>

                        </div>
                    `;

                    return;

                }


                candidaturesList.innerHTML =
                    candidatures.map((candidature) => `

                        <div class="event-card">

                            <h3>
                                ${candidature.discord || "Pseudo inconnu"}
                            </h3>

                            <p>
                                <strong>Âge :</strong>
                                ${candidature.age || "Non renseigné"}
                            </p>

                            <p>
                                <strong>Jeux :</strong>
                                ${candidature.games || "Non renseigné"}
                            </p>

                            <p>
                                <strong>Comment il a connu le GIDC :</strong>
                                ${candidature.known || "Non renseigné"}
                            </p>

                            <p>
                                <strong>Présentation :</strong><br>
                                ${candidature.presentation || "Non renseignée"}
                            </p>

                            <p>
                                <strong>Statut :</strong>
                                ${candidature.status || "En attente"}
                            </p>

                        </div>

                    `).join("");


            } catch (error) {

                console.error(error);

                candidaturesSection.style.display =
                    "block";

                candidaturesList.innerHTML = `
                    <div class="event-card">

                        <h3>
                            ERREUR
                        </h3>

                        <p>
                            Connexion réussie, mais impossible
                            de charger les candidatures.
                        </p>

                    </div>
                `;

            }

        }

    </script>

</body>

</html>
